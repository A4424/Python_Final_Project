name: CI - API Tests

on:
  push:
    branches:
      - main
      - airline-api-test-v7
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:   # <--- Aquí van los secrets como env vars
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      # 1 Clonar repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2 Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3 Instalar dependencias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-html

      # 4 Crear carpeta para reportes y logs
      - name: Prepare reports folder
        run: |
          mkdir -p tests/reports
          mkdir -p tests/logs

      # 5 Ejecutar tests con Pytest + reporte HTML + log
      - name: Run tests with Pytest
        run: |
          pytest -v --maxfail=5 --disable-warnings \
          --html=tests/reports/report.html \
          --self-contained-html \
          --junitxml=tests/reports/results.xml \
          --log-cli-level=INFO \
          --log-file=tests/logs/test.log \
          --log-file-level=INFO
        continue-on-error: false

      # 6 Subir reportes y logs como artefactos
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: |
            tests/reports/
            tests/logs/
